# Fly.io app for bot + API + reminder worker
# Create with: fly apps create telegram-calendar
# Deploy with: fly deploy

app = "telegram-calendar"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
